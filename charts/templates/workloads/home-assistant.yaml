apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: http://pajikos.github.io/home-assistant-helm-chart/
      chart: home-assistant
      targetRevision: 0.3.73
      helm:
        valuesObject:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          podAnnotations:
            descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
            configmap.reloader.stakater.com/reload: home-assistant-mqtt-config
            secret.reloader.stakater.com/reload: home-assistant-mqtt
          initContainers:
            - name: configure-mqtt
              image: ghcr.io/home-assistant/home-assistant:2026.7.4
              command:
                - python3
                - /mnt/mqtt-config/configure.py
              env:
                - name: MQTT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: home-assistant-mqtt
                      key: username
                - name: MQTT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: home-assistant-mqtt
                      key: credential
              volumeMounts:
                - name: home-assistant
                  mountPath: /config
                - name: mqtt-config
                  mountPath: /mnt/mqtt-config
                  readOnly: true
          additionalVolumes:
            - name: mqtt-config
              configMap:
                name: home-assistant-mqtt-config
          ingress:
            enabled: false
          persistence:
            enabled: true
            storageClass: ceph-rbd
            size: 20Gi
          configuration:
            enabled: true
            forceInit: true
            templateConfig: |-
              # Loads default set of integrations. Do not remove.
              default_config:

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 127.0.0.1
                  - 10.244.0.0/16
              
              prometheus:
                requires_auth: false

              # Load frontend themes from the themes folder
              frontend:
                themes: !include_dir_merge_named themes

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml
          serviceMonitor:
            enabled: true

    - repoURL: https://charts.derwitt.dev
      chart: home-assistant-matter-server 
      targetRevision: 3.3.0
      helm:
        valuesObject:
          networkInterface: eth1
          nodeSelector:
            chik4ge.me/iot-access: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          podAnnotations:
            descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
          persistence:
            storageClassName: ceph-rbd
            size: 2Gi

    - repoURL: https://github.com/chik4ge-homelab/homelab-applications
      targetRevision: main
      path: manifests/workloads/home-assistant
  destination:
    namespace: home-assistant
    server: {{ .Values.spec.destination.server }}
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: "privileged"
