apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: koordinator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://koordinator-sh.github.io/charts/
      chart: koordinator
      targetRevision: 1.8.0
      helm:
        valuesObject:
          installation:
            namespace: koordinator-system
          koordlet:
            features: BECPUEvict=false,BEMemoryEvict=false,CgroupReconcile=false,Accelerators=false
          manager:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          scheduler:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          descheduler:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          deviceDaemon:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: intel.feature.node.kubernetes.io/gpu
                        operator: In
                        values:
                          - "true"
                  - matchExpressions:
                      - key: nvidia.com/gpu.count
                        operator: In
                        values:
                          - "1"
    - repoURL: https://github.com/chik4ge-homelab/homelab-applications
      targetRevision: main
      path: manifests/platform/services/ops/koordinator
  destination:
    namespace: koordinator-system
    server: {{ .Values.spec.destination.server }}
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
