apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: koordinator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/chik4ge-homelab/homelab-applications
      targetRevision: main
      path: vendor/helm/koordinator-1.8.0
      helm:
        valuesObject:
          installation:
            namespace: koordinator-system
          featureGates: ReservationMutatingWebhook=true
          koordlet:
            resources:
              requests:
                cpu: 100m
              limits:
                cpu: "1"
            log:
              level: "2"
            features: BECPUEvict=false,BEMemoryEvict=false,CgroupReconcile=false,Accelerators=false
            hostDirs:
              koordProxyRegisterDir: /var/run/koordlet/
              vgpuContainersDir: /var/run/koordlet/vgpu-containers
          manager:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          scheduler:
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          descheduler:
            replicas: 1
            podAnnotations:
              koordinator.chik4ge.me/config-revision: migration-failure-guard-v1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          deviceDaemon:
            resources:
              requests:
                cpu: 50m
              limits:
                cpu: "1"
            log:
              level: "2"
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: intel.feature.node.kubernetes.io/gpu
                        operator: In
                        values:
                          - "true"
                  - matchExpressions:
                      - key: nvidia.com/gpu.count
                        operator: In
                        values:
                          - "1"
    - repoURL: https://github.com/chik4ge-homelab/homelab-applications
      targetRevision: main
      path: manifests/platform/services/ops/koordinator
  destination:
    namespace: koordinator-system
    server: {{ .Values.spec.destination.server }}
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: koordinator-mutating-webhook-configuration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: koordinator-validating-webhook-configuration
      jqPathExpressions:
        - .metadata.annotations.template
        - .webhooks[]?.clientConfig.caBundle
