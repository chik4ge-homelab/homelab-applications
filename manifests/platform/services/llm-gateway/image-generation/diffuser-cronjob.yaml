apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-generation-diffuser
  labels:
    app.kubernetes.io/name: image-generation-diffuser
    app.kubernetes.io/part-of: image-generation
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-diffuser
        app.kubernetes.io/part-of: image-generation
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-generation-diffuser
            app.kubernetes.io/part-of: image-generation
        spec:
          restartPolicy: Never
          serviceAccountName: image-generation-job
          runtimeClassName: nvidia
          initContainers:
            - name: prepare-model-cache
              image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
              args:
                - |
                  set -eu
                  python -m pip install --no-cache-dir 'huggingface_hub==0.36.2'
                  exec python /config/cache.py /config/diffuser.json
              env:
                - name: HF_HUB_DISABLE_XET
                  value: "1"
                - name: MODEL_CACHE_ROOT
                  value: /cache
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: models
                  mountPath: /cache
                - name: model-cache-config
                  mountPath: /config
                  readOnly: true
          containers:
            - name: diffuser
              image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:c5097f8175e55d4ef64616f19c4459ed01f992dc3e8e84a61b1cc3667a1a62d3
              imagePullPolicy: IfNotPresent
              args:
                - --input
                - /inputs/input.json
                - --output
                - /dev/termination-log
              env:
                - name: MODEL_PATH
                  value: /models
                - name: ARTIFACT_ENDPOINT
                  value: http://external-rgw-backend.rook-ceph.svc.cluster.local:7480
                - name: BUCKET_NAME
                  value: image-generation-artifacts
              envFrom:
                - secretRef:
                    name: image-generation-artifacts
              resources:
                requests:
                  cpu: "2"
                  memory: 6Gi
                  nvidia.com/gpu: "1"
                limits:
                  memory: 12Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: input
                  mountPath: /inputs
                  readOnly: true
                - name: models
                  mountPath: /models
                  readOnly: true
          volumes:
            - name: input
              configMap:
                name: image-generation-diffuser-input-template
                items:
                  - key: input.json
                    path: input.json
            - name: models
              persistentVolumeClaim:
                claimName: image-generation-models
            - name: model-cache-config
              configMap:
                name: llm-gateway-model-cache
