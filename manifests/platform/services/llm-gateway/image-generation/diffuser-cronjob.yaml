apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-generation-diffuser
  labels:
    app.kubernetes.io/name: image-generation-diffuser
    app.kubernetes.io/part-of: image-generation
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-diffuser
        app.kubernetes.io/part-of: image-generation
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-generation-diffuser
            app.kubernetes.io/part-of: image-generation
        spec:
          restartPolicy: Never
          serviceAccountName: image-generation-job
          runtimeClassName: nvidia
          initContainers:
            - name: prepare-model-cache
              image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
              args:
                - |
                  set -eu
                  python -m pip install --no-cache-dir 'huggingface_hub==0.36.2'
                  exec python /config/cache.py /config/diffuser.json
              env:
                - name: HF_HUB_DISABLE_XET
                  value: "1"
                - name: MODEL_CACHE_ROOT
                  value: /cache
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: models
                  mountPath: /cache
                - name: model-cache-config
                  mountPath: /config
                  readOnly: true
          containers:
            - name: diffuser
              image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:2dd45b38c16c0cd88a28003f6b1843e6b6c2bfb10e86196b162f08893c800975
              imagePullPolicy: IfNotPresent
              args:
                - --input
                - /inputs/input.json
                - --output
                - /dev/termination-log
              env:
                - name: SD_CPP_ARGS
                  value: |-
                    [
                      "--diffusion-model", "/models/qwen_image_2.1-Q4_K.gguf",
                      "--vae", "/models/vae/qwen_image_2.1_vae_bf16.safetensors",
                      "--llm", "/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf",
                      "-p", "${PROMPT}",
                      "--cfg-scale", "6",
                      "--sampling-method", "euler",
                      "--steps", "${STEPS}",
                      "--seed", "${SEED}",
                      "--backend", "diffusion=cuda0,te=cpu,vae=cuda0",
                      "--params-backend", "diffusion=disk,te=cpu,vae=cuda0",
                      "--max-vram", "cuda0=6",
                      "--diffusion-fa",
                      "-W", "${WIDTH}",
                      "-H", "${HEIGHT}",
                      "-o", "${OUTPUT}"
                    ]
                - name: ARTIFACT_ENDPOINT
                  value: http://external-rgw-backend.rook-ceph.svc.cluster.local:7480
                - name: BUCKET_NAME
                  value: image-generation-artifacts
              envFrom:
                - secretRef:
                    name: image-generation-artifacts
              resources:
                requests:
                  cpu: "2"
                  memory: 6Gi
                  nvidia.com/gpu: "1"
                limits:
                  memory: 12Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: input
                  mountPath: /inputs
                  readOnly: true
                - name: models
                  mountPath: /models
                  readOnly: true
          volumes:
            - name: input
              configMap:
                name: image-generation-diffuser-input-template
                items:
                  - key: input.json
                    path: input.json
            - name: models
              persistentVolumeClaim:
                claimName: image-generation-models
            - name: model-cache-config
              configMap:
                name: llm-gateway-model-cache
