apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-generation-optimizer
  labels:
    app.kubernetes.io/name: image-generation-optimizer
    app.kubernetes.io/part-of: image-generation
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-optimizer
        app.kubernetes.io/part-of: image-generation
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-generation-optimizer
            app.kubernetes.io/part-of: image-generation
        spec:
          restartPolicy: Never
          serviceAccountName: image-generation-job
          runtimeClassName: nvidia
          containers:
            - name: optimizer
              image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:c5bd301fd16df9da18c310f68fdf2f9d6eee503eceb6019667cd265a5d49432a
              imagePullPolicy: IfNotPresent
              args:
                - --input
                - /inputs/input.json
                - --output
                - /dev/termination-log
              env:
                - name: MODEL_PATH
                  value: /models/Qwen-Image-2.1-PE-T2I.Q3_K_M.gguf
                - name: ARTIFACT_ENDPOINT
                  value: http://external-rgw-backend.rook-ceph.svc.cluster.local:7480
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                  nvidia.com/gpu: "1"
                limits:
                  memory: 4Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: input
                  mountPath: /inputs
                  readOnly: true
                - name: models
                  mountPath: /models
                  readOnly: true
          volumes:
            - name: input
              configMap:
                name: image-generation-optimizer-input-template
                items:
                  - key: input.json
                    path: input.json
            - name: models
              persistentVolumeClaim:
                claimName: image-generation-models
