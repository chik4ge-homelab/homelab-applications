apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-generation-optimizer
  labels:
    app.kubernetes.io/name: image-generation-optimizer
    app.kubernetes.io/part-of: image-generation
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-optimizer
        app.kubernetes.io/part-of: image-generation
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-generation-optimizer
            app.kubernetes.io/part-of: image-generation
        spec:
          restartPolicy: Never
          serviceAccountName: image-generation-job
          runtimeClassName: nvidia
          initContainers:
            - name: build-chat-prompt
              image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
              args:
                - |
                  import json
                  from pathlib import Path

                  request = json.loads(Path("/inputs/input.json").read_text())
                  user_prompt = request["prompt"].strip()
                  supported_ratios = {"1:1", "3:2", "2:3", "16:9", "9:16"}
                  aspect_ratio = request.get("aspect_ratio", "1:1")
                  if aspect_ratio not in supported_ratios:
                      aspect_ratio = "1:1"
                  user_prompt += f"\nAspect ratio: {aspect_ratio}"

                  system_prompt = Path("/models/system_prompt.txt").read_text(encoding="utf-8").strip()
                  messages = [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt},
                  ]
                  Path("/work/messages.json").write_text(
                      json.dumps(messages, ensure_ascii=False), encoding="utf-8"
                  )
              resources:
                requests:
                  cpu: "100m"
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: input
                  mountPath: /inputs
                  readOnly: true
                - name: prompt
                  mountPath: /work
                - name: models
                  mountPath: /models
                  readOnly: true
          containers:
            - name: optimizer
              image: ghcr.io/ggml-org/llama.cpp:full-cuda@sha256:1276d8b3f09fe1cb05b8d7369f64a5a9c15619fb05a61f3df1d261a4b53c96d9
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
              args:
                - |
                  import json
                  import sys
                  import subprocess
                  import time
                  import urllib.error
                  import urllib.request
                  from pathlib import Path

                  model = "prithivMLmods/Qwen-Image-2.1-PE-T2I-GGUF"
                  server = subprocess.Popen(
                      [
                          "/app/llama-server",
                          "-hf", model,
                          "--hf-file", "Qwen-Image-2.1-PE-T2I.Q3_K_M.gguf",
                          "--jinja",
                          "--host", "127.0.0.1",
                          "--port", "8080",
                          "-c", "32768",
                          "-ngl", "all",
                          "-t", "2",
                          "--flash-attn", "on",
                          "-ctk", "q8_0",
                          "-ctv", "q8_0",
                          "-b", "128",
                          "-ub", "128",
                          "-np", "1",
                          "--no-warmup",
                          "--no-webui",
                      ]
                  )
                  try:
                      deadline = time.monotonic() + 1800
                      while time.monotonic() < deadline:
                          if server.poll() is not None:
                              raise SystemExit(f"llama-server exited with status {server.returncode}")
                          try:
                              with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2) as response:
                                  if response.status == 200:
                                      break
                          except (urllib.error.URLError, TimeoutError):
                              time.sleep(2)
                      else:
                          raise SystemExit("llama-server readiness timed out")

                      payload = {
                          "model": model,
                          "messages": json.loads(Path("/work/messages.json").read_text(encoding="utf-8")),
                          "temperature": 1.0,
                          "top_p": 0.95,
                          "top_k": 20,
                          "presence_penalty": 1.5,
                          "max_tokens": 16256,
                          "stream": False,
                      }
                      request = urllib.request.Request(
                          "http://127.0.0.1:8080/v1/chat/completions",
                          data=json.dumps(payload).encode("utf-8"),
                          headers={"Content-Type": "application/json"},
                      )
                      with urllib.request.urlopen(request, timeout=1800) as response:
                          completion = json.load(response)["choices"][0]["message"]["content"]
                  finally:
                      server.terminate()
                      try:
                          server.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          server.kill()
                          server.wait()

                  if not isinstance(completion, str):
                      raise SystemExit("Qwen chat completion content is not text")
                  _, marker, answer = completion.partition("</think>")
                  if not marker:
                      answer = completion
                  answer = answer.strip()
                  decoder = json.JSONDecoder()
                  result = None
                  end = 0
                  for start, character in enumerate(answer):
                      if character != "{":
                          continue
                      try:
                          candidate, candidate_end = decoder.raw_decode(answer, start)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(candidate, dict):
                          result = candidate
                          end = candidate_end
                          break
                  if result is None:
                      raise SystemExit("Qwen completion contains no valid JSON object")
                  trailing = answer[end:].strip()
                  if trailing:
                      print(
                          f"Ignoring {len(trailing)} trailing characters after Qwen JSON",
                          file=sys.stderr,
                      )
                  if not isinstance(result, dict) or set(result) != {"rewritten_prompt", "wh_ratio"}:
                      raise SystemExit("Qwen completion must be a JSON object with rewritten_prompt and wh_ratio")
                  if not all(isinstance(result[key], str) and result[key].strip() for key in result):
                      raise SystemExit("Qwen completion fields must be non-empty strings")
                  output = json.dumps(result, ensure_ascii=False, separators=(",", ":"))
                  if len(output.encode("utf-8")) > 4096:
                      raise SystemExit("Qwen completion JSON exceeds the 4 KiB Job result limit")
                  Path("/dev/termination-log").write_text(output, encoding="utf-8")
              env:
                - name: HF_HOME
                  value: /root/.cache/huggingface
              terminationMessagePolicy: File
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                  nvidia.com/gpu: "1"
                limits:
                  memory: 4Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: prompt
                  mountPath: /work
                - name: models
                  mountPath: /models
                  readOnly: true
                - name: optimizer-model-cache
                  mountPath: /root/.cache/huggingface
          volumes:
            - name: input
              configMap:
                name: image-generation-optimizer-input-template
                items:
                  - key: input.json
                    path: input.json
            - name: models
              persistentVolumeClaim:
                claimName: image-generation-models
            - name: optimizer-model-cache
              persistentVolumeClaim:
                claimName: image-generation-optimizer-model-cache
            - name: prompt
              emptyDir: {}
