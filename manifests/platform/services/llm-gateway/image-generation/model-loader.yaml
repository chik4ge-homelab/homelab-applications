apiVersion: batch/v1
kind: Job
metadata:
  name: image-generation-model-loader-v4
  labels:
    app.kubernetes.io/name: image-generation-model-loader
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-model-loader
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nvidia.com/gpu.count: "1"
      containers:
        - name: download-models
          image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              python -m pip install --no-cache-dir 'huggingface_hub>=0.34,<1'
              python - <<'PY'
              from huggingface_hub import hf_hub_download

              files = [
                  (
                      "leejet/Qwen-Image-2.1-GGUF",
                      "qwen_image_2.1-Q4_K.gguf",
                      "cc11433936a06e9765f7c0c0b1f0436cfd2b9856",
                  ),
                  (
                      "prithivMLmods/Qwen-Image-2.1-PE-T2I-GGUF",
                      "Qwen-Image-2.1-PE-T2I.Q3_K_M.gguf",
                      "e18d4a3e0830ab157770738b16830e6fcf5f57d4",
                  ),
                  (
                      "Comfy-Org/Qwen-Image-2.1",
                      "vae/qwen_image_2.1_vae_bf16.safetensors",
                      "5dc5850eb514a3685f6a03a2641728a8f7549c69",
                  ),
                  (
                      "Qwen/Qwen-Image-2.1-PE-T2I",
                      "system_prompt.txt",
                      "f3ed7985c788ad75b3ab7223e0c4c51e2a43545b",
                  ),
              ]
              for repo_id, filename, revision in files:
                  print(
                      hf_hub_download(
                          repo_id=repo_id,
                          filename=filename,
                          revision=revision,
                          local_dir="/models",
                      ),
                      flush=True,
                  )
              PY
          env:
            - name: HF_HUB_DISABLE_XET
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: image-generation-models
