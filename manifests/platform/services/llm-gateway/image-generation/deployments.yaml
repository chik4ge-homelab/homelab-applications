apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-api
  labels:
    app.kubernetes.io/name: image-generation-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-api
  template:
    metadata:
      annotations:
        homelab.chik4ge.me/secret-generation: "3"
      labels:
        app.kubernetes.io/name: image-generation-api
    spec:
      serviceAccountName: image-generation-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:18815782e129efed2cef56a61f9a706581c9cec5997ab2357acc45e7b0648733
          imagePullPolicy: IfNotPresent
          args:
            - api
          env:
            - name: IMAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REQUEST_HEARTBEAT_INTERVAL_SECONDS
              value: "15"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
  strategy:
    type: RollingUpdate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-controller
  labels:
    app.kubernetes.io/name: image-generation-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-controller
    spec:
      serviceAccountName: image-generation-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:18815782e129efed2cef56a61f9a706581c9cec5997ab2357acc45e7b0648733
          imagePullPolicy: IfNotPresent
          args:
            - controller
          env:
            - name: IMAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LLM_RESTORE_TIMEOUT_SECONDS
              value: "300"
            - name: REQUEST_LEASE_TIMEOUT_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
