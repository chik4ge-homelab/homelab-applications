apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-api
  labels:
    app.kubernetes.io/name: image-generation-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-api
    spec:
      serviceAccountName: image-generation-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:8def83e91f675f45d7fdb39a2a3464b01935aecbb4b87a1aa7819cb6b305ba6e
          imagePullPolicy: IfNotPresent
          args:
            - api
          env:
            - name: IMAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ARGOCD_APPLICATION_NAME
              value: llm-gateway
            - name: ARTIFACT_ENDPOINT
              value: https://rgw.chik4ge.me
            - name: BUCKET_NAME
              value: image-generation-artifacts
          envFrom:
            - secretRef:
                name: image-generation-artifacts
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
  strategy:
    type: RollingUpdate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-controller
  labels:
    app.kubernetes.io/name: image-generation-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-controller
    spec:
      serviceAccountName: image-generation-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:8def83e91f675f45d7fdb39a2a3464b01935aecbb4b87a1aa7819cb6b305ba6e
          imagePullPolicy: IfNotPresent
          args:
            - controller
          env:
            - name: IMAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ARGOCD_APPLICATION_NAME
              value: llm-gateway
            - name: ARTIFACT_ENDPOINT
              value: http://external-rgw-backend.rook-ceph.svc.cluster.local:7480
            - name: BUCKET_NAME
              value: image-generation-artifacts
            - name: LLM_RESTORE_TIMEOUT_SECONDS
              value: "300"
          envFrom:
            - secretRef:
                name: image-generation-artifacts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
