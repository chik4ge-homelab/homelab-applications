apiVersion: v1
kind: Pod
metadata:
  name: embeddinggemma-xpu-bench
  labels:
    app.kubernetes.io/name: embeddinggemma-xpu-bench
    app.kubernetes.io/part-of: llm-gateway
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 10
  nodeSelector:
    kubernetes.io/hostname: k8s-w-freesia
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: download-model
      image: ghcr.io/chik4ge-homelab/embeddinggemma-api@sha256:351c88bc401242ce6064d360034bd9c242c21bf4984ce16b3681a1f2571f305e
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
      args:
        - |
          set -eu
          /opt/venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="google/embeddinggemma-2",
              revision="914f7f89142e33e77833254d9c9b90c3cef7303b",
              local_dir="/models/embeddinggemma-2",
          )
          PY
      env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: "600"
        - name: HF_HOME
          value: /tmp/hf
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
          ephemeral-storage: 3Gi
        limits:
          cpu: "1"
          memory: 1Gi
          ephemeral-storage: 10Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: tmp
          mountPath: /tmp
  containers:
    - name: api
      image: ghcr.io/chik4ge-homelab/embeddinggemma-api:api-3e0d01467cda5b643abfdd41c5166f5ce501e144@sha256:fd5631248f95e707b38f44f59f9cbacfd6fe8cfb5bce82f9d738fd483a72b5cb
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      env:
        - name: MODEL_PATH
          value: /models/embeddinggemma-2
        - name: MODEL_NAME
          value: embeddinggemma-2
        - name: MODEL_HUB_REPO
          value: google/embeddinggemma-2
        - name: MODEL_REVISION
          value: 914f7f89142e33e77833254d9c9b90c3cef7303b
        - name: MODEL_DEVICE
          value: xpu
        - name: TORCH_NUM_THREADS
          value: "2"
        - name: MAX_CONCURRENCY
          value: "1"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
        - name: HF_HOME
          value: /tmp/hf
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: NVIDIA_VISIBLE_DEVICES
          value: none
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 3Gi
          gpu.intel.com/i915: 1
        limits:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 10Gi
          gpu.intel.com/i915: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      startupProbe:
        httpGet:
          path: /health/live
          port: http
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 180
      readinessProbe:
        httpGet:
          path: /health/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      volumeMounts:
        - name: model-cache
          mountPath: /models
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: model-cache
      emptyDir:
        sizeLimit: 8Gi
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
