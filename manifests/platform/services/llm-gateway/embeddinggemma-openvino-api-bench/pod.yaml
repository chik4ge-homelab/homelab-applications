apiVersion: v1
kind: Pod
metadata:
  name: embeddinggemma-openvino-api-bench-v3
  labels:
    app.kubernetes.io/name: embeddinggemma-openvino-api-bench-v3
    app.kubernetes.io/part-of: llm-gateway
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 10
  nodeSelector:
    kubernetes.io/hostname: k8s-w-freesia
  tolerations:
    - key: chik4ge.me/gpu
      operator: Equal
      value: "true"
      effect: PreferNoSchedule
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: download-model
      image: ghcr.io/chik4ge-homelab/embeddinggemma-api:openvino-api-e1c26eb881476ace04d475caefca21e410a0bafb@sha256:192608a87eccd4f18513784cd6aea5815ec7c54b49cf99e354e5e1a94568a201
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
      args:
        - |
          set -eu
          /opt/venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="wesjos/embeddinggemma-2-openvino",
              revision="071ca3e23a4765feaa695b662037e09705c29ae2",
              local_dir="/models/openvino",
          )
          PY
      env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: "600"
        - name: HF_HOME
          value: /tmp/hf
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
          ephemeral-storage: 3Gi
        limits:
          cpu: "1"
          memory: 1Gi
          ephemeral-storage: 10Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: tmp
          mountPath: /tmp
  containers:
    - name: api
      image: ghcr.io/chik4ge-homelab/embeddinggemma-api:openvino-api-e101d96fe2614bdc49e34125df958fad0a89de6b@sha256:4c70758089999be5e2f0f0a673c7865eb3feadd2a1705f7bc85cc65a3b543095
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      env:
        - name: MODEL_ROOT
          value: /models/openvino
        - name: MODEL_NAME
          value: embeddinggemma-2
        - name: MODEL_HUB_REPO
          value: wesjos/embeddinggemma-2-openvino
        - name: MODEL_REVISION
          value: 071ca3e23a4765feaa695b662037e09705c29ae2
        - name: IMAGE_TOKEN_BUDGET
          value: "256"
        - name: MAX_CONCURRENCY
          value: "1"
        - name: PORT
          value: "8080"
        - name: HOME
          value: /tmp/home
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: OMP_NUM_THREADS
          value: "4"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: NVIDIA_VISIBLE_DEVICES
          value: none
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 3Gi
          gpu.intel.com/i915: 1
        limits:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 10Gi
          gpu.intel.com/i915: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      startupProbe:
        httpGet:
          path: /health/live
          port: http
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 180
      readinessProbe:
        httpGet:
          path: /health/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      volumeMounts:
        - name: model-cache
          mountPath: /models
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: model-cache
      emptyDir:
        sizeLimit: 8Gi
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
