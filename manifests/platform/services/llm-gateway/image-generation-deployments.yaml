apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-api
  labels:
    app.kubernetes.io/name: image-generation-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-api
    spec:
      serviceAccountName: image-generation-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:311299c200ddd43d858a6fc20bbed4ffeab66bd5923e21a00ccc4c7067d78661
          imagePullPolicy: IfNotPresent
          args:
            - api
          env:
            - name: IMAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ARTIFACT_ENDPOINT
              value: http://external-rgw-backend.rook-ceph.svc.cluster.local:7480
          envFrom:
            - secretRef:
                name: image-generation-artifacts
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
  strategy:
    type: RollingUpdate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-controller
  labels:
    app.kubernetes.io/name: image-generation-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generation-controller
    spec:
      serviceAccountName: image-generation-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:311299c200ddd43d858a6fc20bbed4ffeab66bd5923e21a00ccc4c7067d78661
          imagePullPolicy: IfNotPresent
          args:
            - controller
          env:
            - name: IMAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPTIMIZER_IMAGE
              value: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:0b897b7b3bebf6b6140383fca4cd78cb27829d0d8bf6676c2e40594763197444
            - name: DIFFUSER_IMAGE
              value: ghcr.io/chik4ge-homelab/image-generation-gateway@sha256:c5097f8175e55d4ef64616f19c4459ed01f992dc3e8e84a61b1cc3667a1a62d3
            - name: OPTIMIZER_MODEL_PATH
              value: /models/Qwen-Image-2.1-PE-T2I.Q3_K_M.gguf
            - name: DIFFUSER_MODEL_PATH
              value: /models
            - name: OBJECT_BUCKET_SECRET_NAME
              value: image-generation-artifacts
            - name: ARTIFACT_ENDPOINT
              value: http://external-rgw-backend.rook-ceph.svc.cluster.local:7480
            - name: JOB_ACTIVE_DEADLINE_SECONDS
              value: "3600"
            - name: LLM_RESTORE_TIMEOUT_SECONDS
              value: "300"
          envFrom:
            - secretRef:
                name: image-generation-artifacts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
