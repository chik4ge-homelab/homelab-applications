apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - llama-cpp
  - lfm3-vl-2b
  - litellm
  - image-generation
  - image-generation-webui
  - julia-systemone-api
  - embeddinggemma-api
  - embeddinggemma-xpu-bench
configMapGenerator:
  - name: llm-gateway-model-cache
    files:
      - model-cache/cache.py
      - model-cache/ornith.json
      - model-cache/optimizer.json
      - model-cache/diffuser.json
      - model-cache/embeddinggemma-2.json
  - name: lfm3-vl-2b-model-cache
    files:
      - model-cache/cache.py
      - model-cache/lfm3-vl-2b.json
  - name: julia-systemone-model-cache
    files:
      - model-cache/julia-1.json
