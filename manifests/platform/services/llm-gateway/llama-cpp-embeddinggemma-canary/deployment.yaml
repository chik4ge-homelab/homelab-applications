apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-embeddinggemma-canary
  labels:
    app.kubernetes.io/name: llama-cpp-embeddinggemma-canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-embeddinggemma-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp-embeddinggemma-canary
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-w-blossom
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-model-cache
          image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              python -m pip install --no-cache-dir --target /tmp/python 'huggingface_hub==0.36.2'
              exec env PYTHONPATH=/tmp/python python - <<'PY'
              from huggingface_hub import hf_hub_download

              hf_hub_download(
                  repo_id="unsloth/embeddinggemma-300m-GGUF",
                  filename="embeddinggemma-300m-Q4_0.gguf",
                  revision="6661a6504c30d8304af13455cb4a5d4f5bc6011f",
                  local_dir="/models",
              )
              PY
          env:
            - name: HF_HOME
              value: /tmp/huggingface
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "600"
            - name: HF_HUB_ETAG_TIMEOUT
              value: "60"
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
            - name: PIP_CACHE_DIR
              value: /tmp/pip-cache
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server@sha256:af8c29600d1de84945de13fa7f126d06fdae16c4b19dc7db1c69c74287eae257
          imagePullPolicy: IfNotPresent
          args:
            - -m
            - /models/embeddinggemma-300m-Q4_0.gguf
            - --embedding
            - --pooling
            - mean
            - --embd-normalize
            - "2"
            - --ctx-size
            - "2048"
            - --parallel
            - "1"
            - --threads
            - "4"
            - --threads-batch
            - "4"
            - --batch-size
            - "256"
            - --ubatch-size
            - "128"
            - --alias
            - embeddinggemma-2-llama-canary
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --metrics
            - --no-ui
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-cpp-embeddinggemma-canary-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
