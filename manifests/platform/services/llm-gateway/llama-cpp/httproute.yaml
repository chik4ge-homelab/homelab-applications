apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  parentRefs:
  - name: envoy-gateway-internal
    namespace: envoy-gateway
    sectionName: https
  hostnames:
  - llm-gateway.chik4ge.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/images
    timeouts:
      request: 0s
      backendRequest: 0s
    backendRefs:
    - name: image-generation-webui
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: image-generation-webui
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /_next
    backendRefs:
    - name: image-generation-webui
      port: 3000
  - matches:
    - path:
        type: Exact
        value: /image-studio
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /
    backendRefs:
    - name: image-generation-webui
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /image-studio/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: image-generation-webui
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /v1/images/generations
    timeouts:
      request: 0s
      backendRequest: 0s
    backendRefs:
    - name: image-generation-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/images/edits
    timeouts:
      request: 0s
      backendRequest: 0s
    backendRefs:
    - name: image-generation-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 10m
      backendRequest: 10m
    backendRefs:
    - name: llama-cpp-api
      port: 8000
