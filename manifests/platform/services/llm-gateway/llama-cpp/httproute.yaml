apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  parentRefs:
  - name: envoy-gateway-internal
    namespace: envoy-gateway
    sectionName: https
  hostnames:
  - llm-gateway.chik4ge.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/images/generations
    timeouts:
      request: 65m
      backendRequest: 65m
    backendRefs:
    - name: image-generation-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/images/edits
    timeouts:
      request: 65m
      backendRequest: 65m
    backendRefs:
    - name: image-generation-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 10m
      backendRequest: 10m
    backendRefs:
    - name: llama-cpp-api
      port: 8000
