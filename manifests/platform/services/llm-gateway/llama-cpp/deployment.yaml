apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      annotations:
        descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
      labels:
        app.kubernetes.io/name: llm-gateway
    spec:
      runtimeClassName: nvidia
      initContainers:
      - name: prepare-model-cache
        image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - |
          set -eu
          python -m pip install --no-cache-dir 'huggingface_hub==0.36.2'
          exec python /config/cache.py /config/gemma.json
        env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: MODEL_CACHE_ROOT
          value: /cache
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: llama-cpp-cache
          mountPath: /cache
        - name: model-cache-config
          mountPath: /config
          readOnly: true
      containers:
      - name: llama-cpp
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        imagePullPolicy: Always
        args:
        - -hf
        - kaitchup/gemma-4-12b-it-GGUF-MoQ
        - --hf-file
        - MoQ-3.75.gguf
        - --mmproj-url
        - https://huggingface.co/ggml-org/gemma-4-12B-it-GGUF/resolve/main/mmproj-gemma-4-12B-it-BF16.gguf
        - --alias
        - google/gemma-4-12b-it
        - --chat-template-file
        - /etc/llama/chat_template.jinja
        - --chat-template-kwargs
        - '{"preserve_thinking":true}'

        - --host
        - 127.0.0.1
        - --port
        - "8001"

        - -c
        - "131072"

        - -ngl
        - all

        - --flash-attn
        - "on"

        - -ctk
        - q8_0
        - -ctv
        - q8_0

        - -b
        - "512"
        - -ub
        - "512"

        - -np
        - "1"

        - --no-warmup

        - -n
        - "-1"

        - --repeat-penalty
        - "1.15"

        - --cache-ram
        - "2048"
        - --ctx-checkpoints
        - "2"

        - --api-key-file
        - /run/secrets/llm-gateway/api-key

        ports:
        - name: llama-http
          containerPort: 8001

        env:
        - name: HF_HOME
          value: /root/.cache/huggingface

        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 4Gi
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: llama-cpp-cache
          mountPath: /root/.cache/huggingface
        - name: llm-gateway-api-key
          mountPath: /run/secrets/llm-gateway
          readOnly: true
        - name: llama-cpp-chat-template
          mountPath: /etc/llama
          readOnly: true

      - name: gateway-proxy
        image: nginxinc/nginx-unprivileged:stable-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5
        imagePullPolicy: IfNotPresent
        ports:
        - name: proxy-http
          containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: gateway-proxy-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: gateway-proxy-tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: proxy-http
          periodSeconds: 10
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /health
            port: proxy-http
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 6

      volumes:
      - name: llama-cpp-cache
        persistentVolumeClaim:
          claimName: llama-cpp-cache
      - name: model-cache-config
        configMap:
          name: llm-gateway-model-cache
      - name: llm-gateway-api-key
        secret:
          secretName: llm-gateway-api-key
      - name: llama-cpp-chat-template
        configMap:
          name: llama-cpp-chat-template
      - name: gateway-proxy-config
        configMap:
          name: llama-cpp-gateway-proxy
      - name: gateway-proxy-tmp
        emptyDir: {}
