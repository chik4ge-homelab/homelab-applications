apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      annotations:
        descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
      labels:
        app.kubernetes.io/name: llm-gateway
    spec:
      runtimeClassName: nvidia
      initContainers:
      - name: prepare-model-cache
        image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - |
          set -eu
          python -m pip install --no-cache-dir 'huggingface_hub==0.36.2'
          exec python /config/cache.py /config/ornith.json
        env:
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: MODEL_CACHE_ROOT
          value: /cache
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: llama-cpp-cache
          mountPath: /cache
        - name: model-cache-config
          mountPath: /config
          readOnly: true
      containers:
      - name: llama-cpp
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        imagePullPolicy: Always
        args:
        - -hf
        - ornith-ai/Ornith-1.5-9B-GGUF
        - --hf-file
        - Ornith-1.5-9B-Q4_K_M.gguf
        - --mmproj-auto
        - --alias
        - ornith-1.5-9b-q4_k_m
        - --chat-template-file
        - /etc/llama/chat_template.jinja
        - --chat-template-kwargs
        - '{"enable_thinking":false}'

        - --host
        - 0.0.0.0
        - --port
        - "8000"

        - -c
        - "262144"

        - -ngl
        - all

        - --flash-attn
        - "on"

        - --no-mmproj-offload
        - --no-kv-offload

        - -ctk
        - q4_0
        - -ctv
        - q4_0

        - -t
        - "4"

        - -b
        - "512"
        - -ub
        - "512"

        - -np
        - "1"

        - --spec-type
        - draft-mtp
        - --spec-draft-n-max
        - "3"

        - --no-warmup

        - -n
        - "-1"

        - --repeat-penalty
        - "1.15"

        - --cache-ram
        - "2048"
        - --ctx-checkpoints
        - "2"

        - --api-key-file
        - /run/secrets/llm-gateway/api-key

        ports:
        - name: llama-http
          containerPort: 8000

        env:
        - name: HF_HOME
          value: /root/.cache/huggingface

        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 10Gi
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: llama-cpp-cache
          mountPath: /root/.cache/huggingface
        - name: llm-gateway-api-key
          mountPath: /run/secrets/llm-gateway
          readOnly: true
        - name: llama-cpp-chat-template
          mountPath: /etc/llama
          readOnly: true

        readinessProbe:
          httpGet:
            path: /health
            port: llama-http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /health
            port: llama-http
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 6

      volumes:
      - name: llama-cpp-cache
        persistentVolumeClaim:
          claimName: llama-cpp-cache
      - name: model-cache-config
        configMap:
          name: llm-gateway-model-cache
      - name: llm-gateway-api-key
        secret:
          secretName: llm-gateway-api-key
      - name: llama-cpp-chat-template
        configMap:
          name: llama-cpp-chat-template
