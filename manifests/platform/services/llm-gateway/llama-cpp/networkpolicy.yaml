apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-cpp
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            k8s:app.kubernetes.io/name: litellm-proxy
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
