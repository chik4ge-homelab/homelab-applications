server {
    listen 8000;
    server_name _;

    client_max_body_size 512m;
    client_body_timeout 65m;

    location = /v1/images/generations {
        proxy_pass http://image-generation-api.llm-gateway.svc.cluster.local:8080/v1/images/generations;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 65m;
        proxy_read_timeout 65m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /v1/images/edits {
        proxy_pass http://image-generation-api.llm-gateway.svc.cluster.local:8080/v1/images/edits;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 65m;
        proxy_read_timeout 65m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10m;
    }
}
