apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddinggemma-vllm-test
  labels:
    app.kubernetes.io/name: embeddinggemma-vllm-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddinggemma-vllm-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddinggemma-vllm-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/vllm/vllm-openai-cpu@sha256:8024248339dc6878daa5349344ed29d49c8a6732f6bdf7400fda32ce33e4b30b
          imagePullPolicy: IfNotPresent
          args:
            - /cache
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --runner
            - pooling
            - --served-model-name
            - embeddinggemma-2-vllm
            - --dtype
            - float32
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "2"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: 0-3
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /cache
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embeddinggemma-api-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
