apiVersion: apps/v1
kind: Deployment
metadata:
  name: julia-systemone-api
  labels:
    app.kubernetes.io/name: julia-systemone-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: julia-systemone-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: julia-systemone-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-model-cache
          image: ghcr.io/chik4ge-homelab/julia-systemone-api@sha256:dabc28b861edb1cf1a0c2352aae9e48e9b440270448979d00682439b13040802
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              /opt/venv/bin/python /config/cache.py /julia-config/julia-1.json
              mkdir -p /models/Julia-1
              cp -a /opt/julia/Julia-1/. /models/Julia-1/
              ln -sfn /cache/model.safetensors /models/Julia-1/model.safetensors
          env:
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: MODEL_CACHE_ROOT
              value: /cache
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: model-files
              mountPath: /models
            - name: model-cache-config
              mountPath: /config
              readOnly: true
            - name: julia-model-config
              mountPath: /julia-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/chik4ge-homelab/julia-systemone-api@sha256:dabc28b861edb1cf1a0c2352aae9e48e9b440270448979d00682439b13040802
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JULIA_CPU_THREADS
              value: "4"
            - name: JULIA_MAX_LENGTH
              value: "8192"
            - name: JULIA_HEAD_LENGTH
              value: "512"
            - name: JULIA_MODEL_PATH
              value: /models/Julia-1
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /cache
              readOnly: true
            - name: model-files
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: julia-systemone-model-cache
        - name: model-files
          emptyDir:
            sizeLimit: 256Mi
        - name: model-cache-config
          configMap:
            name: llm-gateway-model-cache
        - name: julia-model-config
          configMap:
            name: julia-systemone-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
