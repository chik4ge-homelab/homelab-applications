apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddinggemma-api
  labels:
    app.kubernetes.io/name: embeddinggemma-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddinggemma-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddinggemma-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-model-cache
          image: ghcr.io/chik4ge-homelab/embeddinggemma-api@sha256:bdd837147ad698a8d341c312f2b1154d22fde5f0ba8344cc8364b1acbaa34a0e
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              /opt/venv/bin/python /config/cache.py /model-config/embeddinggemma-2.json
          env:
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: MODEL_CACHE_ROOT
              value: /cache
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: model-cache-config
              mountPath: /config
              readOnly: true
            - name: model-cache-config
              mountPath: /model-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/chik4ge-homelab/embeddinggemma-api@sha256:bdd837147ad698a8d341c312f2b1154d22fde5f0ba8344cc8364b1acbaa34a0e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: /cache
            - name: MODEL_NAME
              value: embeddinggemma-2
            - name: MODEL_HUB_REPO
              value: google/embeddinggemma-2
            - name: MODEL_REVISION
              value: 914f7f89142e33e77833254d9c9b90c3cef7303b
            - name: TORCH_NUM_THREADS
              value: "2"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: MAX_CONCURRENCY
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /cache
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embeddinggemma-api-model-cache
        - name: model-cache-config
          configMap:
            name: llm-gateway-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
