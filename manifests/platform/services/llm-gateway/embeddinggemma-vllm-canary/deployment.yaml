apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddinggemma-vllm-canary
  labels:
    app.kubernetes.io/name: embeddinggemma-vllm-canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddinggemma-vllm-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddinggemma-vllm-canary
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-cp-argon
                      - k8s-w-anemone
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-transformers-overlay
          image: docker.io/vllm/vllm-openai-cpu:nightly@sha256:eaca946cf7d2881d287305ac23f1f6155d93dbdb1fdc9a84a08831a0d1e78ecf
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -eu
              python -m pip install \
                --no-cache-dir \
                --no-deps \
                --target /tmp/transformers-overlay \
                transformers==5.19.0
          env:
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
            - name: PIP_CACHE_DIR
              value: /tmp/pip-cache
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: prepare-model-cache
          image: docker.io/vllm/vllm-openai-cpu:nightly@sha256:eaca946cf7d2881d287305ac23f1f6155d93dbdb1fdc9a84a08831a0d1e78ecf
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -eu
              python - <<'PY'
              from huggingface_hub import snapshot_download

              snapshot_download(
                  repo_id="google/embeddinggemma-2",
                  revision="914f7f89142e33e77833254d9c9b90c3cef7303b",
                  local_dir="/cache",
                  max_workers=2,
              )
              PY
          env:
            - name: HF_HOME
              value: /tmp/huggingface
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "600"
            - name: HF_HUB_ETAG_TIMEOUT
              value: "60"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai-cpu:nightly@sha256:eaca946cf7d2881d287305ac23f1f6155d93dbdb1fdc9a84a08831a0d1e78ecf
          imagePullPolicy: IfNotPresent
          args:
            - /cache
            - --runner
            - pooling
            - --dtype
            - float32
            - --gpu-memory-utilization
            - "0.25"
            - --max-model-len
            - "8192"
            - --max-num-seqs
            - "1"
            - --enforce-eager
            - --served-model-name
            - embeddinggemma-2-vllm-canary
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --disable-access-log-for-endpoints
            - /health,/metrics,/ping
          env:
            - name: PYTHONPATH
              value: /tmp/transformers-overlay
            - name: HF_HOME
              value: /tmp/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: OMP_NUM_THREADS
              value: "3"
            - name: MKL_NUM_THREADS
              value: "3"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: auto
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/torchinductor
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 10Gi
            limits:
              cpu: "4"
              memory: 10Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /cache
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embeddinggemma-vllm-canary-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
