apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embeddinggemma-vllm-canary-model-cache
  labels:
    app.kubernetes.io/name: embeddinggemma-vllm-canary
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  volumeMode: Filesystem
  resources:
    requests:
      storage: 8Gi
