apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-ml-adapter-litellm-key
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-connect
    kind: ClusterSecretStore
  target:
    name: immich-ml-adapter-litellm-key
  data:
    - secretKey: api-key
      remoteRef:
        key: Immich ML Adapter LiteLLM API Key
        property: password
