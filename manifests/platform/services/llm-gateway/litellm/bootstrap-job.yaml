apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-bootstrap
  labels:
    app.kubernetes.io/name: litellm-proxy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/berriai/litellm-non_root@sha256:6363e53f135dafbf4a68fac25f77aec3f2b99be37665e8c5f623a952637c220b
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /scripts/bootstrap.py
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_AGENT_API_KEY
            - name: IMMICH_ML_ADAPTER_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-ml-adapter-litellm-key
                  key: api-key
            - name: PROXY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_ADMIN_PASSWORD
            - name: PROXY_VIEWER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_VIEWER_EMAIL
            - name: PROXY_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_VIEWER_PASSWORD
            - name: PROXY_VIEWER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_VIEWER_API_KEY
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: litellm-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: litellm-scripts
          configMap:
            name: litellm-scripts
