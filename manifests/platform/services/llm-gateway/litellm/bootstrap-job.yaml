apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-bootstrap
  labels:
    app.kubernetes.io/name: litellm-proxy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/berriai/litellm-non_root@sha256:bee25ffdd3952562401cd1cb844f2b925f006ea8102d719b6d311cc844594d6c
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /scripts/bootstrap.py
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_AGENT_API_KEY
            - name: PROXY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_ADMIN_PASSWORD
            - name: PROXY_VIEWER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_VIEWER_EMAIL
            - name: PROXY_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_VIEWER_PASSWORD
            - name: PROXY_VIEWER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_VIEWER_API_KEY
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: litellm-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: litellm-scripts
          configMap:
            name: litellm-scripts
