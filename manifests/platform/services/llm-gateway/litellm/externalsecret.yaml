apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-connect
    kind: ClusterSecretStore
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LiteLLM Proxy Credentials
        property: master_key
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: LiteLLM Proxy Credentials
        property: salt_key
    - secretKey: LITELLM_AGENT_API_KEY
      remoteRef:
        key: LiteLLM Proxy Credentials
        property: agent_api_key
    - secretKey: PROXY_VIEWER_EMAIL
      remoteRef:
        key: LiteLLM Proxy Viewer
        property: viewer_email
    - secretKey: PROXY_VIEWER_PASSWORD
      remoteRef:
        key: LiteLLM Proxy Viewer
        property: viewer_password
    - secretKey: PROXY_VIEWER_API_KEY
      remoteRef:
        key: LiteLLM Proxy Viewer
        property: viewer_api_key
    - secretKey: LITELLM_DB_USERNAME
      remoteRef:
        key: LiteLLM Proxy Credentials
        property: db_username
    - secretKey: LITELLM_DB_PASSWORD
      remoteRef:
        key: LiteLLM Proxy Credentials
        property: db_password
