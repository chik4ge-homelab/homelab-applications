apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generation-webui
  labels:
    app.kubernetes.io/name: image-generation-webui
    app.kubernetes.io/part-of: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generation-webui
  template:
    metadata:
      annotations:
        homelab.chik4ge.me/secret-generation: "3"
      labels:
        app.kubernetes.io/name: image-generation-webui
        app.kubernetes.io/part-of: llm-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webui
          image: ghcr.io/chik4ge-homelab/image-generation-webui@sha256:dc4eaa44ce5284f2f3e43db73ea31cffbb8a877f222ce40ae2ebfea16c3a3447
          imagePullPolicy: IfNotPresent
          env:
            - name: IMAGE_API_BASE_URL
              value: http://litellm-proxy.llm-gateway.svc.cluster.local:4000/v1
            - name: IMAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_AGENT_API_KEY
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    type: RollingUpdate
