apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfm3-vl-2b
  labels:
    app.kubernetes.io/name: lfm3-vl-2b
    app.kubernetes.io/part-of: llm-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lfm3-vl-2b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lfm3-vl-2b
        app.kubernetes.io/part-of: llm-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-model-cache
          image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              python -m pip install --no-cache-dir --target /tmp/python-packages 'huggingface_hub==0.36.2'
              export PYTHONPATH=/tmp/python-packages
              exec python /config/cache.py /config/lfm3-vl-2b.json
          env:
            - name: HOME
              value: /tmp
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "600"
            - name: MODEL_CACHE_ROOT
              value: /cache
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: model-cache-config
              mountPath: /config
              readOnly: true
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp@sha256:c0a11067c72bb1eb330b8bddbf9869274c195e596bf4fae55fd527102e644b85
          imagePullPolicy: IfNotPresent
          args:
            - -m
            - /models/LFM3-VL-2B-Q4_K_M.gguf
            - --mmproj
            - /models/mmproj-LFM3-VL-2B-Q8_0.gguf
            - --alias
            - lfm3-vl-2b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - -c
            - "128000"
            - -t
            - "2"
            - -b
            - "512"
            - -ub
            - "128"
            - -np
            - "1"
            - -n
            - "8192"
            - -ctk
            - q4_0
            - -ctv
            - q4_0
            - --temp
            - "0.1"
            - --top-p
            - "1.0"
            - --top-k
            - "50"
            - --min-p
            - "0.0"
            - --repeat-penalty
            - "1.1"
            - --no-reasoning-preserve
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: lfm3-vl-2b-model-cache
        - name: model-cache-config
          configMap:
            name: lfm3-vl-2b-model-cache
