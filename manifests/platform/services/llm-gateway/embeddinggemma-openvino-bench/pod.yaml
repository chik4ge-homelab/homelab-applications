apiVersion: v1
kind: Pod
metadata:
  name: embeddinggemma-openvino-bench
  labels:
    app.kubernetes.io/name: embeddinggemma-openvino-bench
    app.kubernetes.io/part-of: llm-gateway
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  nodeSelector:
    kubernetes.io/hostname: k8s-w-freesia
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  tolerations:
    - key: chik4ge.me/gpu
      operator: Equal
      value: "true"
      effect: PreferNoSchedule
  containers:
    - name: openvino
      image: openvino/ubuntu24_dev@sha256:7512312434bd33892ce04b9bda86ffa94805fb35b7673b44b4f0cfe29917a91a
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
      args:
        - mkdir -p "$HOME" "$HF_HOME" "$PIP_CACHE_DIR" /tmp && exec sleep infinity
      env:
        - name: HOME
          value: /workspace/home
        - name: HF_HOME
          value: /workspace/hf-cache
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: PIP_CACHE_DIR
          value: /workspace/pip-cache
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: NVIDIA_VISIBLE_DEVICES
          value: none
        - name: OMP_NUM_THREADS
          value: "8"
        - name: PYTHONUNBUFFERED
          value: "1"
      ports:
        - name: http
          containerPort: 8081
          protocol: TCP
      resources:
        requests:
          cpu: "4"
          memory: 6Gi
          ephemeral-storage: 6Gi
          gpu.intel.com/i915: 1
        limits:
          cpu: "8"
          memory: 8Gi
          ephemeral-storage: 12Gi
          gpu.intel.com/i915: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 10Gi
    - name: tmp
      emptyDir:
        sizeLimit: 512Mi
