apiVersion: v1
kind: ConfigMap
metadata:
  name: koord-descheduler-config
  namespace: koordinator-system
data:
  koord-descheduler-config: |
    apiVersion: descheduler/v1alpha2
    kind: DeschedulerConfiguration
    enableContentionProfiling: false
    enableProfiling: false
    healthzBindAddress: 0.0.0.0:10251
    metricsBindAddress: 0.0.0.0:10251
    leaderElection:
      resourceLock: leases
      resourceName: koord-descheduler
      resourceNamespace: koordinator-system
    deschedulingInterval: 2m
    dryRun: false
    maxNoOfPodsToEvictPerNode: 1
    maxNoOfPodsToEvictPerNamespace: 1
    maxNoOfPodsToEvictTotal: 1
    profiles:
      - name: gpu-to-generic
        plugins:
          deschedule:
            disabled:
              - name: "*"
          balance:
            disabled:
              - name: "*"
            enabled:
              - name: CustomPriority
              - name: RemoveDuplicates
          evict:
            disabled:
              - name: "*"
            enabled:
              - name: MigrationController
        pluginConfig:
          - name: MigrationController
            args:
              apiVersion: descheduler/v1alpha2
              kind: MigrationControllerArgs
              evictionPolicy: Eviction
              evictLocalStoragePods: true
              dryRun: false
              nodeFit: true
              defaultJobMode: ReservationFirst
              # Disable the default 5m workload rate limiter. It can requeue a
              # pending job until the default 5m job TTL expires.
              # Concurrency remains bounded by maxMigrating* and maxUnavailable*.
              objectLimiters:
                workload:
                  duration: 0s
              labelSelector:
                matchExpressions:
                  - key: koordinator.chik4ge.me/migration-blocked
                    operator: NotIn
                    values: ["true"]
              schedulerNames:
                - default-scheduler
                - koord-scheduler
              namespaces:
                exclude:
                  - koordinator-system
              maxConcurrentReconciles: 1
              maxMigratingGlobally: 1
              maxMigratingPerNode: 1
              maxMigratingPerNamespace: 1
              maxMigratingPerWorkload: 1
              maxUnavailablePerWorkload: 1
              skipCheckExpectedReplicas: true
              evictQPS: "0.1"
              evictBurst: 1
          - name: CustomPriority
            args:
              apiVersion: descheduler/v1alpha2
              kind: CustomPriorityArgs
              # NodeFit does not check pod anti-affinity and the reservation is
              # not restricted to target nodes, causing repeated GPU-to-GPU moves.
              # Keep paused until target placement is validated and enforced.
              paused: true
              dryRun: false
              evictableNamespaces:
                exclude:
                  - koordinator-system
              nodeFit: true
              mode: BestEffort
              podSelectors:
                - name: without-migration-failure
                  selector:
                    matchExpressions:
                      - key: koordinator.chik4ge.me/migration-blocked
                        operator: NotIn
                        values: ["true"]
              evictionOrder:
                - name: gpu
                  nodeSelector:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-w-blossom
                          - k8s-w-edelweiss
                          - k8s-w-freesia
                - name: generic
                  nodeSelector:
                    matchExpressions:
                      - key: intel.feature.node.kubernetes.io/gpu
                        operator: DoesNotExist
                      - key: nvidia.com/gpu.count
                        operator: DoesNotExist
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          - name: RemoveDuplicates
            args:
              apiVersion: descheduler/v1alpha2
              kind: RemoveDuplicatesArgs
              excludeOwnerKinds:
                - ReplicaSet
