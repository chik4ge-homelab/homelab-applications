apiVersion: v1
kind: ConfigMap
metadata:
  name: koord-descheduler-config
  namespace: koordinator-system
data:
  koord-descheduler-config: |
    apiVersion: descheduler/v1alpha2
    kind: DeschedulerConfiguration
    enableContentionProfiling: false
    enableProfiling: false
    healthzBindAddress: 0.0.0.0:10251
    metricsBindAddress: 0.0.0.0:10251
    leaderElection:
      resourceLock: leases
      resourceName: koord-descheduler
      resourceNamespace: koordinator-system
    deschedulingInterval: 2m
    dryRun: false
    maxNoOfPodsToEvictPerNode: 1
    maxNoOfPodsToEvictPerNamespace: 1
    maxNoOfPodsToEvictTotal: 1
    profiles:
      - name: gpu-to-generic
        nodeSelector:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
        plugins:
          deschedule:
            disabled:
              - name: "*"
          balance:
            disabled:
              - name: "*"
            enabled:
              - name: CustomPriority
          evict:
            disabled:
              - name: "*"
            enabled:
              - name: MigrationController
        pluginConfig:
          - name: MigrationController
            args:
              apiVersion: descheduler/v1alpha2
              kind: MigrationControllerArgs
              evictionPolicy: Eviction
              evictLocalStoragePods: true
              defaultJobMode: ReservationFirst
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: image-generation-webui
              schedulerNames:
                - koord-scheduler
              namespaces:
                include:
                  - llm-gateway
              maxConcurrentReconciles: 1
              maxMigratingGlobally: 1
              maxMigratingPerNode: 1
              maxMigratingPerNamespace: 1
              maxMigratingPerWorkload: 1
              maxUnavailablePerWorkload: 1
              skipCheckExpectedReplicas: true
              evictQPS: "0.1"
              evictBurst: 1
          - name: CustomPriority
            args:
              apiVersion: descheduler/v1alpha2
              kind: CustomPriorityArgs
              dryRun: false
              evictableNamespaces:
                include:
                  - llm-gateway
              podSelectors:
                - name: image-generation-webui
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: image-generation-webui
              nodeFit: true
              mode: BestEffort
              evictionOrder:
                - name: gpu
                  nodeSelector:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-w-blossom
                          - k8s-w-edelweiss
                          - k8s-w-freesia
                - name: generic
                  nodeSelector:
                    matchExpressions:
                      - key: intel.feature.node.kubernetes.io/gpu
                        operator: DoesNotExist
                      - key: nvidia.com/gpu.count
                        operator: DoesNotExist
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
