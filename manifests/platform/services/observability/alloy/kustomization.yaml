apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alloy

resources:
  - rules/mixin-generated
  - rules/kube-client-certificate-alerts.yaml
  - secrets/alertmanager-discord-webhook.yaml
  - gateway/httproute.yaml
  - oci-edge-services.yaml

configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy=config/alloy-config.alloy

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: PrometheusRule
      name: k8s-mixin-alerts
    path: rules/kube-client-certificate-alerts-patch.yaml
