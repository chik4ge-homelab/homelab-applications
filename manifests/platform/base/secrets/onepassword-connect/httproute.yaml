apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: connect
  namespace: onepassword-connect
spec:
  parentRefs:
    - name: envoy-gateway-internal
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - connect.chik4ge.me
  rules:
    - backendRefs:
        - name: onepassword-connect
          port: 8080
