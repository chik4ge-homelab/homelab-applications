apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-ml-adapter
  labels:
    app.kubernetes.io/name: immich-ml-adapter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-ml-adapter
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            k8s:app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            k8s:app.kubernetes.io/name: machine-learning
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            k8s:app.kubernetes.io/name: litellm-proxy
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
