apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecrets.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
configMapGenerator:
  - name: pi-agent-config
    files:
      - settings.json=agent/settings.json
      - SYSTEM.md=agent/SYSTEM.md
      - discord-image-tools.js=extensions/discord-image-tools.js
      - llm-readiness.mjs=extensions/llm-readiness.mjs
