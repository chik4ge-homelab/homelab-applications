# yaml-language-server: $schema=https://artifacthub.io/api/v1/packages/41047d86-5c50-4d89-b4fc-9083efcd7acf/4.26.3/values-schema

initContainers:
  - name: prepare-upload-area
    image: atmoz/sftp:alpine
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -ec
    args:
      - |
        mkdir -p /data/world-v4.1.8 /data/.sftp-host-keys
        chown 1000:2000 /data/world-v4.1.8
        chmod 2775 /data/world-v4.1.8

        if [ ! -s /data/.sftp-host-keys/ssh_host_ed25519_key ]; then
          ssh-keygen -t ed25519 -f /data/.sftp-host-keys/ssh_host_ed25519_key -N ''
        fi
        if [ ! -s /data/.sftp-host-keys/ssh_host_rsa_key ]; then
          ssh-keygen -t rsa -b 4096 -f /data/.sftp-host-keys/ssh_host_rsa_key -N ''
        fi
        chown root:root /data/.sftp-host-keys/ssh_host_*
        chmod 600 /data/.sftp-host-keys/ssh_host_*_key

        mkdir -p /sftp-home/upload/.ssh/keys
        cp /sftp-key/id_ed25519.pub /sftp-home/upload/.ssh/keys/id_ed25519.pub
        chmod 0444 /sftp-home/upload/.ssh/keys/id_ed25519.pub
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 10m
        memory: 32Mi
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
      - name: datadir
        mountPath: /data
      - name: sftp-home
        mountPath: /sftp-home
      - name: sftp-key
        mountPath: /sftp-key
        readOnly: true

sidecarContainers:
  - name: sftp
    image: atmoz/sftp:alpine
    imagePullPolicy: IfNotPresent
    ports:
      - name: sftp
        containerPort: 22
        protocol: TCP
    readinessProbe:
      tcpSocket:
        port: sftp
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
      - name: datadir
        mountPath: /home/upload/world
        subPath: world-v4.1.8
      - name: datadir
        mountPath: /etc/ssh/ssh_host_ed25519_key
        subPath: .sftp-host-keys/ssh_host_ed25519_key
        readOnly: true
      - name: datadir
        mountPath: /etc/ssh/ssh_host_rsa_key
        subPath: .sftp-host-keys/ssh_host_rsa_key
        readOnly: true
      - name: sftp-home
        mountPath: /home
      - name: sftp-users
        mountPath: /etc/sftp/users.conf
        subPath: users.conf
        readOnly: true

podSecurityContext:
  fsGroup: 2000
  runAsGroup: 3000
  runAsNonRoot: false

resources:
  requests:
    cpu: 4
    memory: 9Gi
  limits:
    cpu: 4
    memory: 9Gi

image:
  tag: java17

workloadAsStatefulSet: true
strategyType: RollingUpdate

startupProbe:
  enabled: true
  failureThreshold: 90
  periodSeconds: 10

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: chik4ge.me/node-tier
              operator: NotIn
              values:
                - small

minecraftServer:
  eula: TRUE
  version: "1.20.1"
  worldSaveName: world-v4.1.8
  type: MODRINTH
  onlineMode: true
  whitelist:
  enforceSecureProfile: true
  memory: 6G
  motd: "Prominence II Hasturian Era 4.1.8 JP"
  serviceType: ClusterIP
  rcon:
    enabled: false
    password: ""
  autoCurseForge:
    apiKey:
      key: ""

extraEnv:
  ALLOW_FLIGHT: "true"
  CREATE_CONSOLE_IN_PIPE: "true"
  ENFORCE_WHITELIST: "true"
  WHITELIST:
    valueFrom:
      secretKeyRef:
        name: minecraft-vanilla-local-common-secret
        key: whitelist
  MODRINTH_MODPACK: /data/Prominence2-JP-v4.1.8.mrpack
  MODRINTH_FORCE_INCLUDE_FILES: athena
  MODRINTH_FORCE_SYNCHRONIZE: "true"
  OVERRIDE_ICON: "true"
  PATCH_DEFINITIONS: /config-patches/connectivity.json

extraVolumes:
  - volumeMounts:
      - name: config-patches
        mountPath: /config-patches
        readOnly: true
    volumes:
      - name: config-patches
        configMap:
          name: minecraft-vanilla-local-config-patches
  - volumes:
      - name: sftp-home
        emptyDir: {}
      - name: sftp-users
        configMap:
          name: minecraft-vanilla-local-sftp-users
      - name: sftp-key
        secret:
          secretName: minecraft-vanilla-local-sftp-key

persistence:
  dataDir:
    enabled: true
    existingClaim: minecraft-vanilla-local-prominence-data
